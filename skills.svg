<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-label="Skill proficiency" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; }
    .pct { font-weight: 500; fill: #94A3B8; }
    .track { fill: #94A3B8; fill-opacity: 0.22; }
  </style>

  <!-- Left column -->
  <text x="20" y="34">AI / ML</text>
  <text class="pct" x="360" y="34" text-anchor="end">95%</text>
  <rect class="track" x="20" y="44" width="340" height="8" rx="4"/>
  <rect x="20" y="44" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="323" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>

  <text x="20" y="84">AI Agents</text>
  <text class="pct" x="360" y="84" text-anchor="end">88%</text>
  <rect class="track" x="20" y="94" width="340" height="8" rx="4"/>
  <rect x="20" y="94" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="299.2" dur="1.4s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>

  <text x="20" y="134">Cloud</text>
  <text class="pct" x="360" y="134" text-anchor="end">82%</text>
  <rect class="track" x="20" y="144" width="340" height="8" rx="4"/>
  <rect x="20" y="144" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="278.8" dur="1.4s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>

  <!-- Right column -->
  <text x="420" y="34">RAG Systems</text>
  <text class="pct" x="760" y="34" text-anchor="end">92%</text>
  <rect class="track" x="420" y="44" width="340" height="8" rx="4"/>
  <rect x="420" y="44" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="312.8" dur="1.4s" begin="0.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>

  <text x="420" y="84">MLOps</text>
  <text class="pct" x="760" y="84" text-anchor="end">85%</text>
  <rect class="track" x="420" y="94" width="340" height="8" rx="4"/>
  <rect x="420" y="94" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="289" dur="1.4s" begin="0.65s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>

  <text x="420" y="134">Backend</text>
  <text class="pct" x="760" y="134" text-anchor="end">86%</text>
  <rect class="track" x="420" y="144" width="340" height="8" rx="4"/>
  <rect x="420" y="144" width="0" height="8" rx="4" fill="url(#fill)">
    <animate attributeName="width" from="0" to="292.4" dur="1.4s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
  </rect>
</svg>
