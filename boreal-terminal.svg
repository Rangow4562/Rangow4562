  <text x="24" y="212" class="code" xml:space="preserve" clip-path="url(#c7)">  <tspan class="key">focus:</tspan> <tspan class="val">Multi-Agent Harnesses · MCP · GraphRAG · Low-Latency LLM Serving</tspan></text>

  <text x="24" y="244" class="code key" xml:space="preserve" clip-path="url(#c8)">benchmarks:</text>
