  <text x="24" y="324" class="code" xml:space="preserve" clip-path="url(#c12)">  <tspan class="key">quantization:</tspan>           <tspan class="num">"AWQ / FP8"</tspan></text>
  <text x="24" y="344" class="code" xml:space="preserve" clip-path="url(#c13)">  <tspan class="key">stack_depth:</tspan>            <tspan class="num">"07 Layers"</tspan></text>

  <text x="24" y="376" class="code key" xml:space="preserve" clip-path="url(#c14)">current_mission:</text>
  <text x="24" y="396" class="code" xml:space="preserve" clip-path="url(#c15)"><tspan class="dash">-</tspan> Designing deterministic multi-agent harnesses with tool-use &amp; planning</text>
  <text x="24" y="416" class="code" xml:space="preserve" clip-path="url(#c16)"><tspan class="dash">-</tspan> Fine-tuning domain LLMs (LoRA, QLoRA, RLHF, DPO, SFT)</text>
  <text x="24" y="436" class="code" xml:space="preserve" clip-path="url(#c17)"><tspan class="dash">-</tspan> Architecting GraphRAG &amp; hybrid retrieval pipelines at enterprise scale</text>
  <text x="24" y="456" class="code" xml:space="preserve" clip-path="url(#c18)"><tspan class="dash">-</tspan> Optimizing low-latency inference (vLLM, TensorRT-LLM, Triton, AWQ/FP8)</text>
  <text x="24" y="476" class="code" xml:space="preserve" clip-path="url(#c19)"><tspan class="dash">-</tspan> Building multi-modal AI systems across Vision, Language, and Code</text>

  <text x="24" y="508" class="code key" xml:space="preserve" clip-path="url(#c20)">exploring:</text>
  <text x="24" y="528" class="code" xml:space="preserve" clip-path="url(#c21)"><tspan class="dash">-</tspan> Mixture of Experts (MoE) &amp; sparse routing architectures</text>
  <text x="24" y="548" class="code" xml:space="preserve" clip-path="url(#c22)"><tspan class="dash">-</tspan> Agent protocols (MCP, A2A) &amp; deterministic evaluation guardrails</text>
  <text x="24" y="568" class="code" xml:space="preserve" clip-path="url(#c23)"><tspan class="dash">-</tspan> On-device &amp; edge LLM inference optimization</text>

