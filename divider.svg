<svg xmlns="http://www.w3.org/2000/svg" width="800" height="6" viewBox="0 0 800 6" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93C5FD" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="2" width="800" height="2" rx="1" fill="url(#base)"/>
  <rect x="-160" y="1" width="160" height="4" rx="2" fill="url(#glow)">
    <animate attributeName="x" from="-160" to="800" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
